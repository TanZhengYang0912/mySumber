name: mysumber
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  csv: ^6.0.0
  provider: ^6.1.5
  intl: ^0.20.2
  supabase_flutter: ^2.9.0
  fl_chart: ^1.2.0
  uuid: ^4.5.3
  http: ^1.2.0
  file_picker: ^12.0.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.34.3

flutter:
  uses-material-design: true
  assets:
    - assets/water_consumption.csv
    - assets/water_production.csv
    - assets/electricity_consumption.csv
    - assets/electricity_supply.csv
